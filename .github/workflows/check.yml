name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check skills
        run: npm run check-skills

      - name: Check plugin version
        run: npm run check-plugin-version
